    research:
      - name: "MonoTTC: Object-Level Time-to-Contact Estimation under Limited
          Supervision"
        date: 2026-08
        summary: "B.Sc. thesis supervised by Farjana Parvin, Department of CSE,
          RUET"
        highlights:
          - "Developed a two-stage PyTorch pipeline combining self-supervised
            ResNet-18 and PoseNet geometry pretraining on temporal nuScenes
            triplets with ROI-supervised TTC adaptation using frozen RAFT-Small."
          - "Derived audited metric TTC targets from nuScenes 3D tracks,
            calibrated ego poses, and camera geometry using scene-disjoint splits,
            a 25% label budget, and a single 16 GB GPU."
          - "Across five seeds and 87 validation scenes, geometric consistency
            produced a 5.33% descriptive reduction in scene-balanced relative TTC
            error from 0.4131 ± 0.0186 to 0.3911 ± 0.0178."
          - "Reduced absolute MAE for urgent 0–2 s TTC targets from 2.1075 s to
            1.6826 s; the paired 95% confidence interval included zero, so the
            overall improvement was not statistically significant."
          - "Achieved AUROC of 0.8667 ± 0.0256 and AUPRC of 0.2080 ± 0.0493 for
            oracle risk classification of critical targets with TTC ≤ 2.0 s."

